name: Create Sentinel rules from templates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview candidates or create enabled rules
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: sentinel-template-rules
  cancel-in-progress: false

jobs:
  create-rules:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_62931b70807347c0b1bb1fd4c064975d }}
      RESOURCE_GROUP: seclabenv
      WORKSPACE: sentinellab2026
      API_VERSION: 2025-09-01

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_62931b70807347c0b1bb1fd4c064975d }}
          tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_62931b70807347c0b1bb1fd4c064975d }}
          subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_62931b70807347c0b1bb1fd4c064975d }}
          environment: AzureCloud
          audience: api://AzureADTokenExchange

      - name: Preview or create scheduled rules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PagedItems([string] $Uri) {
            $items = [Collections.Generic.List[object]]::new()
            while (-not [string]::IsNullOrWhiteSpace($Uri)) {
              $output = az rest --method get --url $Uri --output json
              if ($LASTEXITCODE -ne 0) {
                throw "GET failed: $Uri"
              }
              $response = $output | ConvertFrom-Json -Depth 100
              foreach ($item in @($response.value)) {
                $items.Add($item)
              }
              $Uri = [string]$response.nextLink
            }
            return $items.ToArray()
          }

          function Escape-Summary([object] $Value) {
            return ([string]$Value).Replace('|', '\|').Replace("`r", ' ').Replace("`n", ' ')
          }

          $baseUri = "https://management.azure.com/subscriptions/$env:AZURE_SUBSCRIPTION_ID/resourceGroups/$env:RESOURCE_GROUP/providers/Microsoft.OperationalInsights/workspaces/$env:WORKSPACE/providers/Microsoft.SecurityInsights"
          $templates = @(Get-PagedItems "$baseUri/alertRuleTemplates?api-version=$env:API_VERSION")
          $rules = @(Get-PagedItems "$baseUri/alertRules?api-version=$env:API_VERSION")

          $representedTemplates = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $existingRuleNames = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($rule in $rules) {
            if ($rule.name) {
              [void]$existingRuleNames.Add([string]$rule.name)
            }
            $templateName = [string]$rule.properties.alertRuleTemplateName
            if ($templateName) {
              [void]$representedTemplates.Add($templateName)
            }
          }

          $copyProperties = @(
            'alertDetailsOverride', 'customDetails', 'description', 'displayName',
            'entityMappings', 'eventGroupingSettings', 'incidentConfiguration',
            'query', 'queryFrequency', 'queryPeriod', 'severity',
            'suppressionDuration', 'suppressionEnabled', 'tactics', 'techniques',
            'triggerOperator', 'triggerThreshold'
          )
          $results = [Collections.Generic.List[object]]::new()
          $unsupported = 0
          $alreadyExists = 0
          $planned = 0
          $created = 0
          $failed = 0

          foreach ($template in $templates) {
            if ([string]$template.kind -ne 'Scheduled') {
              $unsupported++
              continue
            }
            $templateName = [string]$template.name
            if ($representedTemplates.Contains($templateName)) {
              $alreadyExists++
              continue
            }

            $ruleId = ''
            try {
              if (-not $templateName) {
                throw 'Template name is empty.'
              }
              $displayName = [string]$template.properties.displayName
              if (-not $displayName) {
                throw 'Template displayName is empty.'
              }
              [guid]$parsedGuid = [guid]::Empty
              if ([guid]::TryParse($templateName, [ref]$parsedGuid)) {
                $ruleId = $templateName
              } else {
                $ruleId = [guid]::NewGuid().ToString()
              }
              if ($existingRuleNames.Contains($ruleId)) {
                throw "Rule ID '$ruleId' already exists without a template reference."
              }

              $properties = [ordered]@{}
              foreach ($propertyName in $copyProperties) {
                $property = $template.properties.PSObject.Properties[$propertyName]
                if ($null -ne $property -and $null -ne $property.Value) {
                  $properties[$propertyName] = $property.Value
                }
              }
              if (-not $properties.Contains('suppressionDuration')) {
                $properties.suppressionDuration = 'PT5H'
              }
              if (-not $properties.Contains('suppressionEnabled')) {
                $properties.suppressionEnabled = $false
              }
              $properties.enabled = $true
              $properties.alertRuleTemplateName = $templateName
              $templateVersion = [string]$template.properties.version
              if ($templateVersion) {
                $properties.templateVersion = $templateVersion
              }
              $payload = [ordered]@{ kind = 'Scheduled'; properties = $properties }

              if ($env:MODE -eq 'preview') {
                $planned++
                $result = 'Preview'
              } else {
                $ruleUri = "$baseUri/alertRules/$([uri]::EscapeDataString($ruleId))?api-version=$env:API_VERSION"
                $bodyPath = Join-Path $env:RUNNER_TEMP "sentinel-rule-$([guid]::NewGuid()).json"
                try {
                  $payload | ConvertTo-Json -Depth 100 | Set-Content $bodyPath -Encoding utf8NoBOM
                  $output = az rest --method put --url $ruleUri --body "@$bodyPath" --output none 2>&1
                  if ($LASTEXITCODE -ne 0) {
                    throw "PUT failed: $($output -join ' ')"
                  }
                } finally {
                  Remove-Item $bodyPath -Force -ErrorAction SilentlyContinue
                }
                $created++
                $result = 'Created'
                [void]$existingRuleNames.Add($ruleId)
                [void]$representedTemplates.Add($templateName)
              }
              $results.Add([pscustomobject]@{ Result = $result; Template = $templateName; Rule = $ruleId; DisplayName = $displayName; Error = '' })
              Write-Host "$($result.ToUpper()): $displayName"
            } catch {
              $failed++
              $results.Add([pscustomobject]@{ Result = 'Failed'; Template = $templateName; Rule = $ruleId; DisplayName = [string]$template.properties.displayName; Error = $_.Exception.Message })
              Write-Warning "FAILED: $templateName - $($_.Exception.Message)"
            }
          }

          $summary = @(
            '## Microsoft Sentinel template rule creation', '',
            "Mode: **$env:MODE**", '',
            '| Item | Count |', '| --- | ---: |',
            "| Templates returned | $($templates.Count) |",
            "| Existing rules returned | $($rules.Count) |",
            "| Unsupported kinds skipped | $unsupported |",
            "| Already represented skipped | $alreadyExists |",
            "| Previewed | $planned |",
            "| Created | $created |",
            "| Failed | $failed |", '',
            '| Result | Display name | Template | Error |',
            '| --- | --- | --- | --- |'
          )
          foreach ($item in $results) {
            $summary += '| {0} | {1} | {2} | {3} |' -f (Escape-Summary $item.Result), (Escape-Summary $item.DisplayName), (Escape-Summary $item.Template), (Escape-Summary $item.Error)
          }
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY

          if ($env:MODE -eq 'apply' -and $failed -gt 0) {
            throw "$failed rule creation(s) failed."
          }
